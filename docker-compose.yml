services:
  db:
    image: pgvector/pgvector:pg16          # PostgreSQL 16 with the pgvector extension
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      ANALYST_DB_PASSWORD: ${ANALYST_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # roles + databases, only on the first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://adapted_app:${APP_DB_PASSWORD}@db:5432/adapted
      MIGRATOR_DATABASE_URL: postgresql+psycopg://adapted_migrator:${MIGRATOR_DB_PASSWORD}@db:5432/adapted
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
